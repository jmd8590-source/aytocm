<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Ayuntamiento de Cumbres Mayores — Portal Cívico Municipal</title>
  <meta name="description" content="Portal oficial del Ayuntamiento de Cumbres Mayores (Huelva) para incidencias, patrimonio y presupuestos vecinales." />
  <meta name="theme-color" content="#FF7A18" />

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <!-- Civitas VibeCut Theme Architecture -->
  <link rel="stylesheet" href="./css/variables.css?v=20260901_svg" />
  <link rel="stylesheet" href="./css/base.css?v=20260901_svg" />
  <link rel="stylesheet" href="./css/components.css?v=20260901_svg" />
  <link rel="stylesheet" href="./css/layout.css?v=20260901_svg" />
  <link rel="stylesheet" href="./css/views.css?v=20260901_svg" />
</head>
<body>
  <!-- Global Vector SVG Gradients Defs -->
  <div id="svg-defs-container"></div>

  <!-- Accessibility Skip Link -->
  <a href="#workspace-content-area" class="skip-link">Saltar al contenido principal</a>

  <!-- Top Persona / Role Switcher Strip (High-Contrast, Vibrant Glowing Badges) -->
  <aside class="role-bar" aria-label="Selector de rol de prueba">
    <div class="role-bar-group">
      <div class="role-bar-label">
        <span>🎭</span>
        <span>MODO DEMO / ROL:</span>
      </div>
      <button type="button" class="role-pill active" data-role="ROLE_CITIZEN" onclick="CivitasApp.switchRole('ROLE_CITIZEN')">
        <span style="font-size:0.95rem;">🙋</span>
        <span>Vecina de Cumbres</span>
      </button>
      <button type="button" class="role-pill" data-role="ROLE_EMPLOYEE" onclick="CivitasApp.switchRole('ROLE_EMPLOYEE')">
        <span style="font-size:0.95rem;">🛠️</span>
        <span>Operario Municipal</span>
      </button>
      <button type="button" class="role-pill" data-role="ROLE_MUNICIPAL_ADMIN" onclick="CivitasApp.switchRole('ROLE_MUNICIPAL_ADMIN')">
        <span style="font-size:0.95rem;">🏛️</span>
        <span>Concejalía / Obras</span>
      </button>
      <button type="button" class="role-pill" data-role="ROLE_SUPERADMIN" onclick="CivitasApp.switchRole('ROLE_SUPERADMIN')">
        <span style="font-size:0.95rem;">⚡</span>
        <span>SuperAdmin</span>
      </button>
    </div>
    <div style="font-size: 0.825rem; color: #FFE5C4; font-weight: 750; letter-spacing: 0.02em; text-shadow: 0 1px 2px rgba(0,0,0,0.5);">
      📍 Cumbres Mayores (Huelva) — Sierra de Aracena
    </div>
  </aside>

  <!-- Master Luxury Floating Dashboard Frame (VibeCut Style) -->
  <div class="app-shell">
    <!-- Left Glass Sidebar with Bespoke Vector Icons -->
    <aside class="app-sidebar" role="navigation" aria-label="Menú principal">
      <div>
        <!-- Sidebar Brand -->
        <div class="sidebar-brand" onclick="CivitasApp.navigateTo('home')">
          <div class="brand-icon-flame" id="brand-logo-container">
            <!-- Castle SVG injected -->
          </div>
          <div>
            <div class="sidebar-brand-title">Cumbres Mayores</div>
            <div class="sidebar-brand-sub">Ayuntamiento Oficial</div>
          </div>
        </div>

        <!-- Sidebar Menu Links -->
        <ul class="sidebar-menu" id="sidebar-menu-list">
          <li>
            <button type="button" class="sidebar-link active" data-route="home" onclick="CivitasApp.navigateTo('home')">
              <div class="sidebar-link-icon-box" data-icon="home"></div>
              <span>Inicio</span>
            </button>
          </li>
          <li>
            <button type="button" class="sidebar-link" data-route="report" onclick="CivitasApp.navigateTo('report')">
              <div class="sidebar-link-icon-box" data-icon="report"></div>
              <span>Reportar Aviso</span>
            </button>
          </li>
          <li>
            <button type="button" class="sidebar-link" data-route="map" onclick="CivitasApp.navigateTo('map')">
              <div class="sidebar-link-icon-box" data-icon="map"></div>
              <span>Plano Municipal</span>
            </button>
          </li>
          <li>
            <button type="button" class="sidebar-link" data-route="incidents" onclick="CivitasApp.navigateTo('incidents')">
              <div class="sidebar-link-icon-box" data-icon="incidents"></div>
              <span>Incidencias</span>
            </button>
          </li>
          <li>
            <button type="button" class="sidebar-link" data-route="suggestions" onclick="CivitasApp.navigateTo('suggestions')">
              <div class="sidebar-link-icon-box" data-icon="bulb"></div>
              <span>Presupuestos</span>
            </button>
          </li>
          <li id="sidebar-admin-item" style="display: none;">
            <button type="button" class="sidebar-link" data-route="admin" onclick="CivitasApp.navigateTo('admin')">
              <div class="sidebar-link-icon-box" data-icon="shield"></div>
              <span>Gestión Municipal</span>
            </button>
          </li>
          <li>
            <button type="button" class="sidebar-link" data-route="audit" onclick="CivitasApp.navigateTo('audit')">
              <div class="sidebar-link-icon-box" data-icon="audit"></div>
              <span>Auditoría</span>
            </button>
          </li>
        </ul>
      </div>

      <!-- Sidebar Bottom Card / Fast Action -->
      <div>
        <div class="sidebar-cta-card">
          <div class="gem-icon-box" style="margin: 0 auto 0.5rem; width: 40px; height: 40px;" id="sidebar-cta-icon"></div>
          <div style="font-weight: 850; font-size: 0.875rem; color: #FFFFFF; margin-bottom: 0.2rem;">Participación Vecinal</div>
          <p style="font-size: 0.725rem; color: #D4A386; margin-bottom: 0.85rem;">Tu aviso ayuda a mantener en perfecto estado nuestro pueblo.</p>
          <button type="button" class="btn btn-sunset btn-sm" style="width: 100%;" onclick="CivitasApp.navigateTo('report')">
            + Nuevo Aviso
          </button>
        </div>
      </div>
    </aside>

    <!-- Right Workspace Area -->
    <div class="app-workspace">
      <!-- Top Navigation & Search Bar -->
      <header class="workspace-topbar">
        <!-- Search Bar Input (Pill) -->
        <div class="topbar-search">
          <span class="topbar-search-icon" id="topbar-search-icon"></span>
          <input type="text" placeholder="Buscar por calle, avería, castillo, farolas o sendero..." 
                 oninput="if(CivitasApp.currentRoute==='incidents'){CivitasApp.applyIncidentFilter('search', this.value)}" />
        </div>

        <!-- Topbar Profile & Notifications -->
        <div class="topbar-actions">
          <div class="live-pulse">
            <div class="live-pulse-dot"></div>
            <span>Servicios Operativos</span>
          </div>

          <!-- Current User Profile Avatar Pill (High-Contrast & Large) -->
          <div id="header-user-badge" style="cursor: pointer;" onclick="CivitasApp.switchRole('ROLE_CITIZEN')">
            <!-- Populated dynamically -->
          </div>
        </div>
      </header>

      <!-- Dynamic Inner View Workspace -->
      <main id="workspace-content-area" class="workspace-content" role="main" tabindex="-1">
        <!-- Injected dynamically by CivitasApp -->
      </main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav" aria-label="Navegación móvil">
    <ul class="bottom-nav-list">
      <li>
        <button class="bottom-nav-item active" data-route="home" onclick="CivitasApp.navigateTo('home')">
          <span id="mob-icon-home"></span>
          <span>Inicio</span>
        </button>
      </li>
      <li>
        <button class="bottom-nav-item" data-route="report" onclick="CivitasApp.navigateTo('report')">
          <span id="mob-icon-report"></span>
          <span>Avisar</span>
        </button>
      </li>
      <li>
        <button class="bottom-nav-item" data-route="map" onclick="CivitasApp.navigateTo('map')">
          <span id="mob-icon-map"></span>
          <span>Plano</span>
        </button>
      </li>
      <li>
        <button class="bottom-nav-item" data-route="incidents" onclick="CivitasApp.navigateTo('incidents')">
          <span id="mob-icon-incidents"></span>
          <span>Avisos</span>
        </button>
      </li>
      <li>
        <button class="bottom-nav-item" data-route="suggestions" onclick="CivitasApp.navigateTo('suggestions')">
          <span id="mob-icon-bulb"></span>
          <span>Ideas</span>
        </button>
      </li>
    </ul>
  </nav>

  <!-- Global Modal Dialog Container -->
  <div class="modal-backdrop" id="app-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size: 1.15rem; color:#FFFFFF;">Detalle de la Incidencia</h3>
        <button type="button" class="btn btn-icon btn-secondary btn-sm" onclick="CivitasApp.closeModal()" aria-label="Cerrar modal">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Injected dynamically -->
      </div>
      <div class="modal-footer" id="modal-footer">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- App Bootstrap JS -->
  <script type="module" src="./js/app.js?v=20260901_svg"></script>
</body>
</html>
